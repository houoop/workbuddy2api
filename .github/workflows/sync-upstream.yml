# 每天自动把上游的更新合并进本 fork。
#
# 为什么需要这个：GitHub fork 是静态快照，上游推新 commit 后 fork 不会自动跟进。
# 这个 workflow 让 fork 保持与上游一致，随后 build.yml 的构建就总是最新代码。
#
# 合并策略：fast-forward 优先；有分叉时用 merge（保留我们自己的 workflow 文件）。
name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 UTC 03:17（北京 11:17），错开整点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        run: |
          set -e
          UPSTREAM_REPO="${{ vars.UPSTREAM_REPO }}"
          if [ -z "$UPSTREAM_REPO" ]; then
            echo "::error::本仓库未设置 Actions 变量 UPSTREAM_REPO（格式 owner/repo）"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${{ github.event.repository.default_branch }}" --tags

          BRANCH="${{ github.event.repository.default_branch }}"
          BEFORE=$(git rev-parse "origin/${BRANCH}")

          # 优先 fast-forward；失败则 merge（本仓自带的 workflow 文件可能与上游无关，
          # 上游不带同名文件时不会冲突）。
          if ! git merge --ff-only "upstream/${BRANCH}"; then
            echo "::notice::无法 fast-forward，改用 merge"
            git merge --no-edit "upstream/${BRANCH}" || {
              echo "::warning::合并出现冲突，跳过本次同步（需人工处理）"
              exit 0
            }
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::notice::上游无新提交，无需同步"
          else
            git push origin "HEAD:${BRANCH}"
            echo "::notice::已同步上游更新：${BEFORE:0:8} -> ${AFTER:0:8}"
          fi
